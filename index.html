<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Story 💕</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
        rel="stylesheet" />

    <style>
        /* ── RESET & BASE ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --rose: #c8637a;
            --rose-light: #e8a0ae;
            --rose-pale: #f9ecee;
            --blush: #fdf3f0;
            --cream: #faf7f4;
            --ink: #2b1f1f;
            --ink-soft: #6b4f4f;
            --gold: #c9a96e;
            --gold-light: #e8d4a8;
            --white: #ffffff;
            --shadow: rgba(43, 31, 31, .10);

            --font-display: 'Libre Baskerville', Georgia, serif;
            --font-body: 'Lora', Georgia, serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: var(--font-body);
            font-weight: 300;
            overflow-x: hidden;
        }

        /* ── HERO TEXT COLOURS ON IMAGE ── */
        .hero.has-image .hero-title {
            color: #fff;
        }

        .hero.has-image .hero-title em {
            color: var(--rose-light);
        }

        .hero.has-image .hero-subtitle {
            color: rgba(255, 255, 255, .82);
        }

        .hero.has-image .hero-eyebrow {
            color: var(--rose-light);
        }

        .hero.has-image .hero-date {
            color: var(--gold-light);
        }

        .hero.has-image .hero-heart {
            opacity: .06;
            color: #fff;
        }

        .hero.has-image .hero-scroll span {
            color: rgba(255, 255, 255, .5);
        }

        .hero.has-image .scroll-line {
            background: linear-gradient(to bottom, rgba(255, 255, 255, .4), transparent);
        }

        /* ── EASTER EGG MODAL ── */
        .egg-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(18, 6, 6, .82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .45s;
        }

        .egg-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        .egg-card {
            position: relative;
            background: var(--cream);
            border-radius: 4px;
            padding: 3.5rem 3rem 3rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 32px 80px rgba(0, 0, 0, .45);
            transform: scale(.88) translateY(24px);
            transition: transform .45s cubic-bezier(.22, 1, .36, 1);
        }

        .egg-backdrop.open .egg-card {
            transform: scale(1) translateY(0);
        }

        .egg-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--rose), var(--gold-light), var(--rose));
        }

        .egg-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 1.25rem;
            animation: heartbeat 2.4s ease-in-out infinite;
        }

        .egg-title {
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 300;
            color: var(--rose);
            margin-bottom: 1.25rem;
            line-height: 1.2;
        }

        .egg-message {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            font-size: clamp(.95rem, 2.2vw, 1.15rem);
            line-height: 1.85;
            color: var(--ink-soft);
            white-space: pre-line;
        }

        .egg-close {
            margin-top: 2.25rem;
            background: none;
            border: 1px solid var(--rose-light);
            color: var(--rose);
            font-family: var(--font-body);
            font-weight: 300;
            font-size: .75rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            padding: .65rem 2rem;
            border-radius: 2px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .egg-close:hover {
            background: var(--rose);
            color: #fff;
        }

        /* pulse hint on the hero heart */
        .hero-heart.egg-hint {
            cursor: pointer;
            pointer-events: all !important;
            opacity: .18 !important;
            animation: eggHeartPulse 2.8s ease-in-out infinite !important;
            transition: opacity .3s, transform .3s, filter .3s;
            filter: drop-shadow(0 0 18px rgba(200, 99, 122, .45));
        }

        .hero-heart.egg-hint:hover {
            opacity: .32 !important;
            filter: drop-shadow(0 0 32px rgba(200, 99, 122, .75));
            transform: translate(-50%, -52%) scale(1.06) !important;
            animation-play-state: paused !important;
        }

        @keyframes eggHeartPulse {

            0%,
            100% {
                opacity: .18;
                transform: translate(-50%, -52%) scale(1);
                filter: drop-shadow(0 0 14px rgba(200, 99, 122, .35));
            }

            50% {
                opacity: .26;
                transform: translate(-50%, -52%) scale(1.04);
                filter: drop-shadow(0 0 28px rgba(200, 99, 122, .60));
            }
        }

        /* ── MUSIC PLAYER ── */
        #music-player {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1500;
            display: flex;
            align-items: center;
            gap: .75rem;
            background: rgba(250, 247, 244, .88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(200, 99, 122, .18);
            border-radius: 999px;
            padding: .55rem .55rem .55rem .9rem;
            box-shadow: 0 8px 32px rgba(43, 31, 31, .14);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .5s, transform .5s;
        }

        #music-player.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #music-player.expanded {
            border-radius: 16px;
        }

        .music-info {
            display: flex;
            flex-direction: column;
            max-width: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-width .4s ease, opacity .35s ease, margin .4s ease;
            white-space: nowrap;
        }

        #music-player.expanded .music-info {
            max-width: 180px;
            opacity: 1;
            margin-right: .25rem;
        }

        .music-title {
            font-family: var(--font-display);
            font-style: italic;
            font-size: .85rem;
            color: var(--ink);
            line-height: 1.3;
        }

        .music-artist {
            font-family: var(--font-body);
            font-size: .65rem;
            letter-spacing: .1em;
            color: var(--rose);
            text-transform: uppercase;
            margin-top: .1rem;
        }

        .music-btn {
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background .2s, transform .15s;
            flex-shrink: 0;
        }

        #music-toggle {
            background: var(--rose);
            color: #fff;
        }

        #music-toggle:hover {
            background: #b5556b;
            transform: scale(1.06);
        }

        .music-note {
            font-size: .8rem;
            color: var(--rose-light);
            line-height: 1;
            flex-shrink: 0;
        }

        /* spinning vinyl dots when playing */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #music-player.playing .music-note {
            display: inline-block;
            animation: spin 3s linear infinite;
        }

        /* progress bar */
        .music-progress-wrap {
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width .4s ease, opacity .35s ease;
            display: flex;
            align-items: center;
        }

        #music-player.expanded .music-progress-wrap {
            width: 80px;
            opacity: 1;
        }

        .music-progress {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 3px;
            border-radius: 2px;
            background: var(--rose-pale);
            outline: none;
            cursor: pointer;
        }

        .music-progress::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--rose);
            cursor: pointer;
        }

        .music-progress::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--rose);
            border: none;
            cursor: pointer;
        }

        /* "tap me" hint label */
        .egg-tap-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 68px);
            font-family: var(--font-body);
            font-weight: 200;
            font-size: .65rem;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--rose-light);
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 1s 2.5s forwards;
        }

        .hero.has-image .egg-tap-hint {
            color: rgba(255, 255, 255, .5);
        }

        /* ── TOGETHER COUNTER ── */
        .hero-counter {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeUp .8s 1.25s forwards;
        }

        .counter-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .3rem;
        }

        .counter-num {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: clamp(1.8rem, 5vw, 3rem);
            line-height: 1;
            color: var(--rose);
        }

        .hero.has-image .counter-num {
            color: #fff;
        }

        .counter-label {
            font-family: var(--font-body);
            font-weight: 200;
            font-size: .6rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .hero.has-image .counter-label {
            color: var(--gold-light);
        }

        .counter-sep {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: var(--rose-light);
            line-height: 1;
            align-self: flex-start;
            padding-top: .05em;
            opacity: .5;
        }

        /* ── PETAL PARTICLE CANVAS ── */
        #petal-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .55;
        }

        /* ── HERO ── */
        .hero {
            position: relative;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem 6rem;
            overflow: hidden;
            z-index: 1;
            /* fallback gradient — replaced by JS if heroImage is set */
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200, 99, 122, .18) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(201, 169, 110, .15) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 10% 80%, rgba(200, 99, 122, .10) 0%, transparent 60%),
                var(--cream);
        }

        .hero.has-image {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* dark + romantic vignette overlay on top of the photo */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 100% 55% at 50% 100%, rgba(18, 6, 6, .72) 0%, transparent 70%),
                linear-gradient(to bottom,
                    rgba(18, 6, 6, .42) 0%,
                    rgba(18, 6, 6, .15) 40%,
                    rgba(18, 6, 6, .15) 60%,
                    rgba(18, 6, 6, .55) 100%);
            pointer-events: none;
            transition: opacity .4s;
        }

        /* when no image, keep the overlay invisible */
        .hero:not(.has-image)::before {
            opacity: 0;
        }

        .hero-eyebrow {
            font-family: var(--font-body);
            font-weight: 200;
            font-size: .75rem;
            letter-spacing: .35em;
            text-transform: uppercase;
            color: var(--rose);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp .8s .3s forwards;
        }

        .hero-title {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: clamp(3.2rem, 10vw, 7.5rem);
            line-height: 1.05;
            color: var(--ink);
            opacity: 0;
            animation: fadeUp .9s .5s forwards;
        }

        .hero-title em {
            font-style: italic;
            color: var(--rose);
        }

        .hero-divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 2rem auto;
            opacity: 0;
            animation: fadeUp .7s .75s forwards;
        }

        .hero-subtitle {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            color: var(--ink-soft);
            max-width: 520px;
            line-height: 1.7;
            opacity: 0;
            animation: fadeUp .8s .9s forwards;
        }

        .hero-date {
            margin-top: 2.5rem;
            font-family: var(--font-body);
            font-weight: 200;
            font-size: .8rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0;
            animation: fadeUp .7s 1.1s forwards;
        }

        .hero-scroll {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .5rem;
            opacity: 0;
            animation: fadeIn 1s 1.6s forwards;
        }

        .hero-scroll span {
            font-size: .65rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--rose-light);
        }

        .scroll-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, var(--rose-light), transparent);
            animation: scrollPulse 2s 1.8s infinite;
        }

        /* big decorative heart */
        .hero-heart {
            position: absolute;
            font-size: clamp(90px, 30vw, 180px);
            opacity: .04;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -42%);
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        /* ── SECTION LABEL ── */
        .section-label {
            text-align: center;
            padding: 5rem 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        .section-label h2 {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--ink);
        }

        .section-label h2 em {
            font-style: italic;
            color: var(--rose);
        }

        .section-label p {
            margin-top: .75rem;
            font-size: .8rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--gold);
        }

        /* ── TIMELINE ── */
        .timeline {
            position: relative;
            padding: 3rem 1rem 6rem;
            max-width: 860px;
            margin: 0 auto;
            z-index: 1;
        }

        /* centre spine */
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom,
                    transparent 0%,
                    var(--rose-light) 8%,
                    var(--rose-light) 92%,
                    transparent 100%);
            transform: translateX(-50%);
        }

        /* ── CARD ── */
        .card {
            position: relative;
            width: calc(50% - 2.5rem);
            background: var(--white);
            border-radius: 2px;
            box-shadow: 0 4px 32px var(--shadow), 0 1px 4px rgba(200, 99, 122, .06);
            overflow: hidden;
            margin-bottom: 3.5rem;
            opacity: 0;
            transition: box-shadow .3s;
        }

        .card:hover {
            box-shadow: 0 8px 48px rgba(200, 99, 122, .15), 0 2px 8px rgba(200, 99, 122, .10);
        }

        /* alternate left / right */
        .card:nth-child(odd) {
            margin-left: 0;
            margin-right: auto;
        }

        .card:nth-child(even) {
            margin-left: auto;
            margin-right: 0;
        }

        /* dot on spine */
        .card::before {
            content: '♥';
            position: absolute;
            top: 1.75rem;
            font-size: .65rem;
            color: var(--rose);
            background: var(--cream);
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--rose-light);
            z-index: 2;
        }

        .card:nth-child(odd)::before {
            right: -2.9rem;
            transform: translateX(50%);
        }

        .card:nth-child(even)::before {
            left: -2.9rem;
            transform: translateX(-50%);
        }

        /* connector line to spine */
        .card::after {
            content: '';
            position: absolute;
            top: 2.2rem;
            height: 1px;
            width: 1.5rem;
            background: var(--rose-light);
        }

        .card:nth-child(odd)::after {
            right: -1.5rem;
        }

        .card:nth-child(even)::after {
            left: -1.5rem;
        }

        /* ── CARD MEDIA ── */
        .card-media {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }

        video.card-media {
            background: var(--ink);
        }

        /* placeholder when no media */
        .card-media-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, var(--rose-pale), var(--blush));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        /* ── CARD BODY ── */
        .card-body {
            padding: 1.5rem 1.75rem 1.75rem;
        }

        .card-date {
            font-size: .68rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: .6rem;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 400;
            line-height: 1.25;
            color: var(--ink);
            margin-bottom: .65rem;
        }

        .card-caption {
            font-size: .85rem;
            line-height: 1.75;
            color: var(--ink-soft);
        }

        /* top accent bar */
        .card-accent {
            height: 3px;
            background: linear-gradient(90deg, var(--rose), var(--gold-light));
        }

        /* ── CLOSING ── */
        .closing {
            position: relative;
            text-align: center;
            padding: 6rem 2rem 8rem;
            z-index: 1;
            overflow: hidden;
        }

        .closing::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(200, 99, 122, .10) 0%, transparent 70%);
        }

        .closing-heart {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 1.5rem;
            animation: heartbeat 2.4s ease-in-out infinite;
        }

        .closing-message {
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(1.15rem, 3vw, 1.7rem);
            font-weight: 300;
            line-height: 1.7;
            max-width: 560px;
            margin: 0 auto;
            color: var(--ink-soft);
        }

        .closing-names {
            margin-top: 2.5rem;
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--rose);
            letter-spacing: .05em;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scrollPulse {

            0%,
            100% {
                opacity: 1;
                transform: scaleY(1);
            }

            50% {
                opacity: .4;
                transform: scaleY(.7);
            }
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.18);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.12);
            }

            56% {
                transform: scale(1);
            }
        }

        .card.visible {
            animation: fadeUp .7s forwards;
        }

        /* ── ROMANTIC HIGHLIGHT ── */
        @keyframes romanticGlow {
            0%, 100% { box-shadow: 0 0 22px 6px rgba(217,79,114,.40), 0 4px 32px var(--shadow); }
            50%       { box-shadow: 0 0 44px 14px rgba(217,79,114,.65), 0 4px 32px var(--shadow); }
        }
        @keyframes petalDrift {
            0%   { transform: translateY(-10px) rotate(0deg);   opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: .7; }
            100% { transform: translateY(110px) rotate(360deg); opacity: 0; }
        }
        @keyframes heartFloat {
            0%   { transform: translateY(0)   scale(1);    opacity: .9; }
            100% { transform: translateY(-55px) scale(.5); opacity: 0; }
        }

        .card.romantic {
            border: 2px solid rgba(217,79,114,.60);
            animation: fadeUp .7s forwards, romanticGlow 2.8s ease-in-out 1s infinite;
            background: linear-gradient(160deg, #fff 60%, #fde8ef 100%);
        }
        .card.romantic .card-date {
            color: #d94f72;
        }
        .card.romantic .card-title {
            color: #b8385a;
        }
        .card.romantic .card-body {
            background: linear-gradient(to bottom, transparent, rgba(253,232,239,.55));
        }
        .card.romantic .card-accent {
            background: linear-gradient(to bottom, #d94f72, #e8799a);
        }
        /* ribbon badge */
        .card.romantic .card-accent::after {
            content: '💕 Special';
            position: absolute;
            top: .65rem;
            right: .65rem;
            background: linear-gradient(135deg, #d94f72, #f5b8cc);
            color: #fff;
            font-family: var(--font-body);
            font-size: .62rem;
            font-style: italic;
            letter-spacing: .06em;
            padding: .22rem .65rem;
            border-radius: 999px;
            box-shadow: 0 2px 10px rgba(217,79,114,.45);
            z-index: 10;
            pointer-events: none;
        }
        /* floating petals container */
        .romantic-petals {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: inherit;
            z-index: 1;
        }
        .petal {
            position: absolute;
            top: 0;
            font-size: 1rem;
            animation: petalDrift linear infinite;
            opacity: 0;
        }
        /* floating hearts on hover */
        .card.romantic:hover .heart-burst { display: block; }
        .heart-burst {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }
        .heart-burst span {
            position: absolute;
            bottom: 10%;
            font-size: 1.1rem;
            animation: heartFloat .9s ease-out forwards;
            opacity: 0;
        }

        /* ── CARD THUMB WRAP ── */
        .card-thumb-wrap {
            position: relative;
            overflow: hidden;
        }

        .card-multi-badge {
            position: absolute;
            bottom: .6rem;
            right: .6rem;
            background: rgba(18, 10, 10, .65);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: .65rem;
            letter-spacing: .08em;
            padding: .25rem .55rem;
            border-radius: 2rem;
            pointer-events: none;
        }

        .card-play-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, .85);
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .4);
        }

        /* ── SLIDE BUTTONS (inside lightbox) ── */
        .lb-slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            display: none;
            /* shown by JS when needed */
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }

        .lb-slide-btn:hover {
            background: rgba(200, 99, 122, .5);
        }

        .lb-slide-btn:disabled {
            opacity: .25;
            pointer-events: none;
        }

        .lb-slide-btn.prev {
            left: .5rem;
        }

        .lb-slide-btn.next {
            right: .5rem;
        }

        /* ── DOTS ROW ── */
        .lb-dots-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            min-height: 1.4rem;
            margin-top: .75rem;
        }

        .lb-dots {
            display: flex;
            gap: .4rem;
            align-items: center;
        }

        .lb-dot {
            width: .45rem;
            height: .45rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, .3);
            border: none;
            cursor: pointer;
            padding: 0;
            transition: background .2s, transform .2s;
        }

        .lb-dot.active {
            background: var(--rose-light);
            transform: scale(1.35);
        }

        .lb-counter {
            font-size: .68rem;
            letter-spacing: .12em;
            color: rgba(255, 255, 255, .45);
            display: none;
        }

        /* ── CARD CURSOR ── */
        .card {
            cursor: pointer;
        }

        .card:hover .card-media,
        .card:hover .card-media-placeholder {
            filter: brightness(1.04);
        }

        .card-media,
        .card-media-placeholder {
            transition: filter .3s;
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s;
        }

        .lightbox.open {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(18, 10, 10, .88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .lightbox-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: min(92vw, 980px);
            width: 100%;
            transform: scale(.94) translateY(18px);
            transition: transform .38s cubic-bezier(.22, 1, .36, 1);
        }

        .lightbox.open .lightbox-inner {
            transform: scale(1) translateY(0);
        }

        /* media area */
        .lightbox-media-wrap {
            width: 100%;
            max-height: 72vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
        }

        .lightbox-media-wrap img {
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            display: block;
            border-radius: 3px;
        }

        .lightbox-media-wrap video {
            max-width: 100%;
            max-height: 72vh;
            border-radius: 3px;
            background: #000;
        }

        .lightbox-emoji-full {
            font-size: clamp(5rem, 18vw, 10rem);
            line-height: 1;
            padding: 3rem;
        }

        /* text panel below media */
        .lightbox-info {
            margin-top: 1.25rem;
            text-align: center;
            max-width: 560px;
        }

        .lightbox-date {
            font-size: .68rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: .5rem;
        }

        .lightbox-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 300;
            color: #fff;
            line-height: 1.2;
            margin-bottom: .6rem;
        }

        .lightbox-caption {
            font-size: .9rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, .62);
        }

        /* close button */
        .lightbox-close {
            position: absolute;
            top: -1rem;
            right: -.5rem;
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .18);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
            line-height: 1;
        }

        .lightbox-close:hover {
            background: rgba(200, 99, 122, .5);
        }

        /* prev / next arrows */
        .lightbox-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }

        .lightbox-arrow:hover {
            background: rgba(200, 99, 122, .45);
        }

        .lightbox-arrow.prev {
            left: 1rem;
        }

        .lightbox-arrow.next {
            right: 1rem;
        }

        .lightbox-arrow:disabled {
            opacity: .25;
            pointer-events: none;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .timeline::before {
                left: 1.2rem;
            }

            .card {
                width: calc(100% - 3rem);
                margin-left: 3rem !important;
                margin-right: 0 !important;
            }

            .card::before {
                left: -2.4rem !important;
                right: auto !important;
                transform: translateX(0) !important;
            }

            .card::after {
                left: -1.2rem !important;
                right: auto !important;
                width: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="petal-canvas"></canvas>

    <!-- ══════════════ HERO ══════════════ -->
    <section class="hero">
        <div class="hero-heart">♥</div>
        <span class="egg-tap-hint" id="egg-tap-hint">tap the heart ♥</span>
        <p class="hero-eyebrow" id="hero-eyebrow">A little something for you</p>
        <h1 class="hero-title" id="hero-title">Loading…</h1>
        <div class="hero-divider"></div>
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <p class="hero-date" id="hero-date"></p>

        <div class="hero-counter" id="hero-counter">
            <div class="counter-unit">
                <span class="counter-num" id="cnt-years">0</span>
                <span class="counter-label">years</span>
            </div>
            <span class="counter-sep">·</span>
            <div class="counter-unit">
                <span class="counter-num" id="cnt-months">0</span>
                <span class="counter-label">months</span>
            </div>
            <span class="counter-sep">·</span>
            <div class="counter-unit">
                <span class="counter-num" id="cnt-days">0</span>
                <span class="counter-label">days</span>
            </div>
            <span class="counter-sep">·</span>
            <div class="counter-unit">
                <span class="counter-num" id="cnt-hours">0</span>
                <span class="counter-label">hours</span>
            </div>
            <span class="counter-sep">·</span>
            <div class="counter-unit">
                <span class="counter-num" id="cnt-mins">0</span>
                <span class="counter-label">mins</span>
            </div>
            <span class="counter-sep">·</span>
            <div class="counter-unit">
                <span class="counter-num" id="cnt-secs">0</span>
                <span class="counter-label">secs</span>
            </div>
        </div>

        <div class="hero-scroll">
            <div class="scroll-line"></div>
            <span>our story</span>
        </div>
    </section>

    <!-- ══════════════ TIMELINE ══════════════ -->
    <div class="section-label">
        <p>a journey together</p>
        <h2>Our <em>Timeline</em></h2>
    </div>

    <section class="timeline" id="timeline"></section>

    <!-- ══════════════ CLOSING ══════════════ -->
    <section class="closing">
        <span class="closing-heart">♥</span>
        <p class="closing-message" id="closing-message"></p>
        <p class="closing-names" id="closing-names"></p>
    </section>

    <!-- ══════════════ MUSIC PLAYER ══════════════ -->
    <div id="music-player" role="region" aria-label="Background music">
        <span class="music-note">♪</span>
        <div class="music-info">
            <span class="music-title" id="music-title"></span>
            <span class="music-artist" id="music-artist"></span>
        </div>
        <div class="music-progress-wrap">
            <input class="music-progress" id="music-progress" type="range" min="0" max="100" value="0"
                aria-label="Seek" />
        </div>
        <button class="music-btn" id="music-toggle" aria-label="Play music">▶</button>
    </div>
    <audio id="bg-audio" loop></audio>

    <!-- ══════════════ EASTER EGG ══════════════ -->
    <div class="egg-backdrop" id="egg-backdrop" role="dialog" aria-modal="true" aria-labelledby="egg-title">
        <div class="egg-card">
            <span class="egg-icon" id="egg-icon">💕</span>
            <h2 class="egg-title" id="egg-title"></h2>
            <p class="egg-message" id="egg-message"></p>
            <button class="egg-close" id="egg-close">close ♥</button>
        </div>
    </div>

    <!-- ══════════════ LIGHTBOX ══════════════ -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>

        <!-- between-event navigation (outer) -->
        <button class="lightbox-arrow prev" id="lb-prev" aria-label="Previous memory">&#8592;</button>
        <button class="lightbox-arrow next" id="lb-next" aria-label="Next memory">&#8594;</button>

        <div class="lightbox-inner">
            <button class="lightbox-close" id="lb-close" aria-label="Close">&#10005;</button>

            <!-- media display -->
            <div class="lightbox-media-wrap" id="lb-media"></div>

            <!-- within-event slide controls -->
            <button class="lb-slide-btn prev" id="lb-slide-prev" aria-label="Previous photo">&#8249;</button>
            <button class="lb-slide-btn next" id="lb-slide-next" aria-label="Next photo">&#8250;</button>

            <!-- dots + counter -->
            <div class="lb-dots-row">
                <div class="lb-dots" id="lb-dots"></div>
                <span class="lb-counter" id="lb-counter"></span>
            </div>

            <div class="lightbox-info">
                <p class="lightbox-date" id="lb-date"></p>
                <h2 class="lightbox-title" id="lb-title"></h2>
                <p class="lightbox-caption" id="lb-caption"></p>
            </div>
        </div>
    </div>

    <!-- Config must load first -->
    <script src="config.js"></script>

    <script>
        // ── POPULATE FROM CONFIG ──────────────────────────────────

        document.getElementById('hero-title').innerHTML =
            CONFIG.heroTitle.replace(/(\S+)\s*$/, '<em>$1</em>');

        document.getElementById('hero-subtitle').textContent = CONFIG.heroSubtitle;
        document.getElementById('hero-date').textContent = CONFIG.anniversaryDate;
        document.getElementById('closing-message').textContent = CONFIG.closingMessage;
        document.getElementById('closing-names').textContent =
            `${CONFIG.names.yours}  ♥  ${CONFIG.names.hers}`;

        // ── TOGETHER COUNTER ──────────────────────────────────────

        (function () {
            const start = new Date(2025, 9, 25, 19, 16, 0); // Oct 25 2025, 7:16PM local time

            function update() {
                const now = new Date();
                const diff = now - start;   // ms (may be negative before Oct 25)

                if (diff < 0) {
                    // Not yet — count down to the date instead
                    const abs = -diff;
                    const totalSecs = Math.floor(abs / 1000);
                    const s = totalSecs % 60;
                    const totalMins = Math.floor(totalSecs / 60);
                    const m = totalMins % 60;
                    const totalHrs = Math.floor(totalMins / 60);
                    const h = totalHrs % 24;
                    const d = Math.floor(totalHrs / 24);
                    document.getElementById('cnt-years').textContent = 0;
                    document.getElementById('cnt-months').textContent = 0;
                    document.getElementById('cnt-days').textContent = d;
                    document.getElementById('cnt-hours').textContent = h;
                    document.getElementById('cnt-mins').textContent = String(m).padStart(2, '0');
                    document.getElementById('cnt-secs').textContent = String(s).padStart(2, '0');
                    return;
                }

                // Years & months using calendar math
                let years = now.getFullYear() - start.getFullYear();
                let months = now.getMonth() - start.getMonth();
                if (months < 0) { months += 12; years--; }

                // Anchor = start date shifted forward by full years+months
                const anchor = new Date(start);
                anchor.setFullYear(anchor.getFullYear() + years);
                anchor.setMonth(anchor.getMonth() + months);

                // If anchor is still ahead of now, borrow one month back
                if (anchor > now) {
                    months--;
                    if (months < 0) { months += 12; years--; }
                    anchor.setMonth(anchor.getMonth() - 1);
                }

                const remainMs = now - anchor;
                const totalSecs = Math.floor(remainMs / 1000);
                const secs = totalSecs % 60;
                const totalMins = Math.floor(totalSecs / 60);
                const mins = totalMins % 60;
                const totalHrs = Math.floor(totalMins / 60);
                const hrs = totalHrs % 24;
                const days = Math.floor(totalHrs / 24);

                document.getElementById('cnt-years').textContent = years;
                document.getElementById('cnt-months').textContent = months;
                document.getElementById('cnt-days').textContent = days;
                document.getElementById('cnt-hours').textContent = hrs;
                document.getElementById('cnt-mins').textContent = String(mins).padStart(2, '0');
                document.getElementById('cnt-secs').textContent = String(secs).padStart(2, '0');
            }

            update();
            setInterval(update, 1000);
        })();

        // ── EASTER EGG ────────────────────────────────────────────

        (function () {
            const cfg = CONFIG.easterEgg;
            if (!cfg || cfg.enabled === false) return;

            // Support both a single message (legacy) and a messages array
            const messages = cfg.messages && cfg.messages.length
                ? cfg.messages
                : [{ icon: cfg.icon || '💕', title: cfg.title || 'A secret…', message: cfg.message || '' }];

            let lastIndex = -1;

            function pickRandom() {
                if (messages.length === 1) return messages[0];
                let idx;
                do { idx = Math.floor(Math.random() * messages.length); }
                while (idx === lastIndex);   // avoid showing the same one twice in a row
                lastIndex = idx;
                return messages[idx];
            }

            // Make the hero heart clickable
            const heart = document.querySelector('.hero-heart');
            heart.classList.add('egg-hint');
            heart.setAttribute('role', 'button');
            heart.setAttribute('tabindex', '0');
            heart.setAttribute('aria-label', 'A secret for you…');

            const backdrop = document.getElementById('egg-backdrop');

            function openEgg() {
                const pick = pickRandom();
                document.getElementById('egg-icon').textContent = pick.icon || '💕';
                document.getElementById('egg-title').textContent = pick.title || 'A secret…';
                document.getElementById('egg-message').textContent = pick.message || '';

                backdrop.classList.add('open');
                document.body.style.overflow = 'hidden';
                // hide the hint once discovered
                const hint = document.getElementById('egg-tap-hint');
                if (hint) hint.style.display = 'none';
            }

            function closeEgg() {
                backdrop.classList.remove('open');
                document.body.style.overflow = '';
            }

            heart.addEventListener('click', openEgg);
            heart.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openEgg(); });
            document.getElementById('egg-close').addEventListener('click', closeEgg);
            backdrop.addEventListener('click', e => { if (e.target === backdrop) closeEgg(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && backdrop.classList.contains('open')) closeEgg();
            });
        })();

        // ── HERO BACKGROUND IMAGE ─────────────────────────────────
        if (CONFIG.heroImage) {
            const hero = document.querySelector('.hero');
            const img = new Image();
            img.onload = () => {
                hero.style.backgroundImage = `url("media/${CONFIG.heroImage}")`;
                hero.classList.add('has-image');
            };
            img.src = `media/${CONFIG.heroImage}`;
        }

        // ── HELPERS ───────────────────────────────────────────────

        const EMOJI_FALLBACKS = ['🌸', '☕', '🗺️', '🕯️', '🎆', '💕', '✨', '🌙', '🌹', '🎵'];

        // Normalise an event's media into a flat array of {src, type} objects.
        // Supports: ev.media (string), ev.media (array), ev.images (array), ev.videos (array)
        function getMediaList(ev, eventIndex) {
            const items = [];

            const classify = src =>
                src.match(/\.(mp4|webm|mov|ogg)$/i) ? 'video' : 'image';

            if (Array.isArray(ev.media)) {
                ev.media.forEach(m => {
                    if (typeof m === 'string') items.push({ src: `media/${m}`, type: classify(m) });
                    else if (m.src) items.push({ src: `media/${m.src}`, type: m.type || classify(m.src) });
                });
            } else if (typeof ev.media === 'string') {
                items.push({ src: `media/${ev.media}`, type: ev.type || classify(ev.media) });
            }

            // bonus: ev.images / ev.videos shorthand arrays
            (ev.images || []).forEach(s => items.push({ src: `media/${s}`, type: 'image' }));
            (ev.videos || []).forEach(s => items.push({ src: `media/${s}`, type: 'video' }));

            return items;
        }

        function buildMediaElement({ src, type }) {
            if (type === 'image') {
                const img = document.createElement('img');
                img.src = src; img.alt = ''; img.loading = 'lazy';
                return img;
            }
            if (type === 'video') {
                const vid = document.createElement('video');
                vid.controls = true; vid.playsInline = true; vid.preload = 'metadata';
                vid.innerHTML = `<source src="${src}" />`;
                return vid;
            }
        }

        // ── BUILD TIMELINE ────────────────────────────────────────

        const timeline = document.getElementById('timeline');

        CONFIG.events.forEach((ev, i) => {
            const card = document.createElement('article');
            card.className = 'card';

            const mediaList = getMediaList(ev, i);

            let mediaHTML = '';
            if (mediaList.length > 0) {
                const first = mediaList[0];
                if (first.type === 'image') {
                    // show first image as cover; badge if multiple
                    const badge = mediaList.length > 1
                        ? `<span class="card-multi-badge">+${mediaList.length - 1} more</span>` : '';
                    mediaHTML = `
        <div class="card-thumb-wrap">
          <img class="card-media" src="${first.src}" alt="${ev.title}" loading="lazy" />
          ${badge}
        </div>`;
                } else if (first.type === 'video') {
                    const badge = mediaList.length > 1
                        ? `<span class="card-multi-badge">+${mediaList.length - 1} more</span>` : '';
                    mediaHTML = `
        <div class="card-thumb-wrap">
          <video class="card-media" playsinline preload="metadata" muted>
            <source src="${first.src}" />
          </video>
          <span class="card-play-icon">▶</span>
          ${badge}
        </div>`;
                }
            } else {
                const emoji = ev.title.match(/(\p{Emoji_Presentation}|\p{Extended_Pictographic})/u)?.[0]
                    || EMOJI_FALLBACKS[i % EMOJI_FALLBACKS.length];
                mediaHTML = `<div class="card-media-placeholder">${emoji}</div>`;
            }

            card.innerHTML = `
    <div class="card-accent"></div>
    ${mediaHTML}
    <div class="card-body">
      <p class="card-date">${ev.date}</p>
      <h3 class="card-title">${ev.title}</h3>
      <p class="card-caption">${ev.caption}</p>
    </div>`;

            // ── ROMANTIC HIGHLIGHT ──────────────────────────────
            if (ev.romantic === true) {
                card.classList.add('romantic');

                // floating petals
                const petals = document.createElement('div');
                petals.className = 'romantic-petals';
                const PETAL_CHARS = ['🌸','🌷','💗','✨','🌹'];
                for (let p = 0; p < 8; p++) {
                    const el = document.createElement('span');
                    el.className = 'petal';
                    el.textContent = PETAL_CHARS[p % PETAL_CHARS.length];
                    el.style.left = (10 + Math.random() * 80) + '%';
                    el.style.animationDuration = (3 + Math.random() * 4) + 's';
                    el.style.animationDelay    = (Math.random() * 5) + 's';
                    el.style.fontSize = (.7 + Math.random() * .6) + 'rem';
                    petals.appendChild(el);
                }
                card.appendChild(petals);

                // hover heart burst
                const burst = document.createElement('div');
                burst.className = 'heart-burst';
                const HEARTS = ['💕','💖','💗','💓','💝'];
                for (let h = 0; h < 6; h++) {
                    const hEl = document.createElement('span');
                    hEl.textContent = HEARTS[h % HEARTS.length];
                    hEl.style.left = (8 + Math.random() * 84) + '%';
                    hEl.style.animationDelay = (h * .12) + 's';
                    burst.appendChild(hEl);
                }
                card.appendChild(burst);
            }

            timeline.appendChild(card);
        });

        // ── SCROLL REVEAL ─────────────────────────────────────────

        const cards = document.querySelectorAll('.card');
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    observer.unobserve(e.target);
                }
            });
        }, { threshold: 0.12 });

        cards.forEach(c => observer.observe(c));

        // ── LIGHTBOX ──────────────────────────────────────────────

        const lightbox = document.getElementById('lightbox');
        const lbMedia = document.getElementById('lb-media');
        const lbDate = document.getElementById('lb-date');
        const lbTitle = document.getElementById('lb-title');
        const lbCaption = document.getElementById('lb-caption');
        const lbClose = document.getElementById('lb-close');
        const lbPrev = document.getElementById('lb-prev');       // between events
        const lbNext = document.getElementById('lb-next');       // between events
        const lbBackdrop = document.getElementById('lightbox-backdrop');
        const lbDots = document.getElementById('lb-dots');
        const lbSlidePrev = document.getElementById('lb-slide-prev');
        const lbSlideNext = document.getElementById('lb-slide-next');
        const lbCounter = document.getElementById('lb-counter');

        let currentEventIndex = 0;   // which timeline card
        let currentSlideIndex = 0;   // which media within that card
        let currentMediaList = [];

        function pauseVideos() {
            lbMedia.querySelectorAll('video').forEach(v => v.pause());
        }

        // render the current slide inside the lightbox
        function renderSlide() {
            pauseVideos();
            lbMedia.innerHTML = '';

            const item = currentMediaList[currentSlideIndex];
            if (item) {
                const el = buildMediaElement(item);
                lbMedia.appendChild(el);
                if (item.type === 'video') el.play().catch(() => { });
            }

            // dots
            lbDots.innerHTML = '';
            if (currentMediaList.length > 1) {
                currentMediaList.forEach((_, di) => {
                    const dot = document.createElement('button');
                    dot.className = 'lb-dot' + (di === currentSlideIndex ? ' active' : '');
                    dot.setAttribute('aria-label', `Slide ${di + 1}`);
                    dot.addEventListener('click', e => { e.stopPropagation(); goSlide(di); });
                    lbDots.appendChild(dot);
                });
                lbCounter.textContent = `${currentSlideIndex + 1} / ${currentMediaList.length}`;
                lbCounter.style.display = 'block';
            } else {
                lbCounter.style.display = 'none';
            }

            lbSlideNext.style.display = currentMediaList.length > 1 ? 'flex' : 'none';
            lbSlidePrev.style.display = currentMediaList.length > 1 ? 'flex' : 'none';
            lbSlideNext.disabled = currentSlideIndex >= currentMediaList.length - 1;
            lbSlidePrev.disabled = currentSlideIndex <= 0;
        }

        function goSlide(index) {
            currentSlideIndex = Math.max(0, Math.min(index, currentMediaList.length - 1));
            renderSlide();
        }

        function openLightbox(eventIndex, slideIndex = 0) {
            currentEventIndex = eventIndex;
            currentSlideIndex = slideIndex;
            const ev = CONFIG.events[eventIndex];
            currentMediaList = getMediaList(ev, eventIndex);

            lbDate.textContent = ev.date;
            lbTitle.textContent = ev.title;
            lbCaption.textContent = ev.caption;

            lbPrev.disabled = eventIndex === 0;
            lbNext.disabled = eventIndex === CONFIG.events.length - 1;

            renderSlide();

            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            pauseVideos();
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        function navigateEvent(dir) {
            const next = currentEventIndex + dir;
            if (next >= 0 && next < CONFIG.events.length) openLightbox(next, 0);
        }

        // wire up card clicks
        cards.forEach((card, i) => {
            card.addEventListener('click', () => openLightbox(i, 0));
        });

        lbClose.addEventListener('click', closeLightbox);
        lbBackdrop.addEventListener('click', closeLightbox);
        lbPrev.addEventListener('click', e => { e.stopPropagation(); navigateEvent(-1); });
        lbNext.addEventListener('click', e => { e.stopPropagation(); navigateEvent(+1); });
        lbSlideNext.addEventListener('click', e => { e.stopPropagation(); goSlide(currentSlideIndex + 1); });
        lbSlidePrev.addEventListener('click', e => { e.stopPropagation(); goSlide(currentSlideIndex - 1); });

        // touch/swipe inside the media area for slide navigation
        let touchStartX = 0;
        lbMedia.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
        lbMedia.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 40) goSlide(currentSlideIndex + (dx < 0 ? 1 : -1));
        });

        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            // Left/Right navigate slides first; if at edge, move to next event
            if (e.key === 'ArrowLeft') {
                if (currentSlideIndex > 0) goSlide(currentSlideIndex - 1);
                else navigateEvent(-1);
            }
            if (e.key === 'ArrowRight') {
                if (currentSlideIndex < currentMediaList.length - 1) goSlide(currentSlideIndex + 1);
                else navigateEvent(+1);
            }
        });

        // ── BACKGROUND MUSIC ──────────────────────────────────────

        (function () {
            const cfg = CONFIG.music;
            if (!cfg || cfg.enabled === false) return;

            const player = document.getElementById('music-player');
            const audio = document.getElementById('bg-audio');
            const btn = document.getElementById('music-toggle');
            const progress = document.getElementById('music-progress');
            const titleEl = document.getElementById('music-title');
            const artistEl = document.getElementById('music-artist');

            // Set source — supports local path (relative to index.html) or any direct URL
            audio.src = cfg.src;
            audio.volume = cfg.volume !== undefined ? Math.min(1, Math.max(0, cfg.volume)) : 0.35;
            if (cfg.loop === false) audio.removeAttribute('loop');

            titleEl.textContent = cfg.title || '';
            artistEl.textContent = cfg.artist || '';

            // Show player once audio is ready
            audio.addEventListener('canplay', () => {
                player.classList.add('visible');
                // Auto-expand to show title briefly, then collapse after 5s
                if (cfg.title || cfg.artist) {
                    player.classList.add('expanded');
                    setTimeout(() => {
                        if (!audio.paused) return; // keep expanded while playing
                        player.classList.remove('expanded');
                    }, 4500);
                }
            }, { once: true });

            // Load it
            audio.load();

            let playing = false;

            function setPlaying(state) {
                playing = state;
                btn.textContent = playing ? '⏸' : '▶';
                btn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
                player.classList.toggle('playing', playing);
                player.classList.toggle('expanded', playing || !!(cfg.title || cfg.artist));
            }

            btn.addEventListener('click', () => {
                if (playing) {
                    audio.pause();
                    setPlaying(false);
                } else {
                    audio.play().then(() => setPlaying(true)).catch(() => { });
                }
            });

            // Progress bar sync
            audio.addEventListener('timeupdate', () => {
                if (!audio.duration) return;
                progress.value = (audio.currentTime / audio.duration) * 100;
            });

            progress.addEventListener('input', () => {
                if (!audio.duration) return;
                audio.currentTime = (progress.value / 100) * audio.duration;
            });

            audio.addEventListener('ended', () => {
                if (!audio.loop) setPlaying(false);
            });
        })();

        // ── FALLING PETALS ────────────────────────────────────────

        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Petal {
            constructor() { this.reset(true); }

            reset(init = false) {
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * canvas.height : -20;
                this.size = 4 + Math.random() * 7;
                this.speedY = .4 + Math.random() * .8;
                this.speedX = (Math.random() - .5) * .6;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - .5) * .04;
                this.opacity = .4 + Math.random() * .5;
                this.hue = 340 + Math.random() * 30;   // pink / rose range
                this.sway = Math.random() * Math.PI * 2;
                this.swaySpeed = .008 + Math.random() * .012;
            }

            update() {
                this.sway += this.swaySpeed;
                this.x += this.speedX + Math.sin(this.sway) * .7;
                this.y += this.speedY;
                this.angle += this.spin;
                if (this.y > canvas.height + 20) this.reset();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;

                // simple petal shape
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * .45, this.size, 0, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue},70%,80%)`;
                ctx.fill();
                ctx.restore();
            }
        }

        const PETAL_COUNT = 38;
        const petals = Array.from({ length: PETAL_COUNT }, () => new Petal());

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
